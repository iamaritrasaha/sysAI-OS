name: 'Setup SysAI Engine'
description: 'Provisions the SysAI engine dependency at a pinned commit'
inputs:
  repository:
    description: 'SysAI repository'
    required: false
    default: 'iamaritrasaha/sysai'
  ref:
    description: 'SysAI git commit or tag'
    required: false
    default: 'db4c68ce263e0fad4eff2ea64dd9b92f8f55a136'
  path:
    description: 'Local directory to check out SysAI'
    required: false
    default: '.sysai-engine'
  with-ollama:
    description: 'Whether to install and start local Ollama service with a test model'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Checkout SysAI Engine
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}

    - name: Provision SysAI Engine
      shell: bash
      run: |
        ENGINE_DIR="${{ github.workspace }}/${{ inputs.path }}"
        pip install "${ENGINE_DIR}"
        echo "SYSAI_PATH=${ENGINE_DIR}/src" >> $GITHUB_ENV
        echo "${ENGINE_DIR}/src" > "${{ github.workspace }}/.sysai_path"
        echo "[setup-sysai] Provisioned SysAI engine from ${{ inputs.repository }}@${{ inputs.ref }}"
        echo "[setup-sysai] SYSAI_PATH=${ENGINE_DIR}/src"

    - name: Provision Local Ollama
      if: ${{ inputs.with-ollama == 'true' }}
      shell: bash
      run: |
        if ! command -v ollama &>/dev/null; then
          echo "[setup-sysai] Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
        fi
        if ! curl -s http://127.0.0.1:11434/api/version >/dev/null; then
          if command -v systemctl &>/dev/null && [ "$(systemctl is-system-running 2>/dev/null || true)" = "running" ]; then
            sudo systemctl restart ollama || true
          fi
        fi
        if ! curl -s http://127.0.0.1:11434/api/version >/dev/null; then
          echo "[setup-sysai] Starting Ollama serve in background..."
          ollama serve >/tmp/ollama.log 2>&1 &
        fi
        for i in {1..30}; do
          if curl -s http://127.0.0.1:11434/api/version >/dev/null; then
            echo "[setup-sysai] Ollama service is up"
            break
          fi
          sleep 0.5
        done
        echo "[setup-sysai] Pulling all-minilm..."
        ollama pull all-minilm
        echo "[setup-sysai] Ollama ready with models:"
        ollama list
