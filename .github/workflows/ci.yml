name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  python-bridge-tests:
    name: Python bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bridge tests
        run: PYTHONPATH=bridge python3 -m unittest discover -s bridge/tests -v

  build-linux:
    name: Flutter Linux release build
    runs-on: ubuntu-latest
    needs: [analyze-and-test, python-bridge-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build linux --release
        run: flutter build linux --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysai-os-linux-release
          path: build/linux/x64/release/bundle/
          retention-days: 7
