name: Release

on:
  push:
    tags:
      - 'v*'

env:
  SYSAI_REPO: 'iamaritrasaha/sysai'
  SYSAI_REF: 'db4c68ce263e0fad4eff2ea64dd9b92f8f55a136'

jobs:
  build-and-package:
    name: Build and package Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev rsync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision SysAI Engine
        uses: ./.github/actions/setup-sysai
        with:
          repository: ${{ env.SYSAI_REPO }}
          ref: ${{ env.SYSAI_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build linux --release
        run: flutter build linux --release

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package tarball
        run: |
          chmod +x install/package.sh
          ./install/package.sh --version ${{ steps.version.outputs.VERSION }} --sysai-src .sysai-engine

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysai-os-${{ steps.version.outputs.VERSION }}-linux-x86_64
          path: dist/*.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: true
          generate_release_notes: true
